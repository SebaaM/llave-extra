[project]
name = "llave-extra-backend"
version = "0.1.0"
description = "API Django del programa Llave Extra"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django==5.2.18",
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.29.0",
    "Pillow==11.3.0",
    "psycopg[binary]==3.2.10",
    "qrcode==8.2",
    "redis==6.4.0",
    "PyYAML==6.0.3",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-django==4.11.1",
    "ruff==0.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
