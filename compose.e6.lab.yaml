name: llaveextra-e6-security
services:
  db:
    image: postgres:17.11-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: ${E6_POSTGRES_DB:?Set the isolated lab database name}
      POSTGRES_USER: ${E6_POSTGRES_USER:?Set the isolated lab database user}
      POSTGRES_PASSWORD: ${E6_POSTGRES_PASSWORD:?Generate a synthetic lab database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    pull_policy: never
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  backend:
    image: llaveextra-e6-backend:latest
    pull_policy: never
    working_dir: /app
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "1", "--access-logfile", "-", "--access-logformat", "%(m)s %(s)s %(b)s %(L)s", "--error-logfile", "-"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${E6_DJANGO_SECRET_KEY:?Generate a synthetic Django key}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      JWT_SIGNING_KEY: ${E6_JWT_SIGNING_KEY:?Generate an independent synthetic JWT key}
      QR_SIGNING_KEY: ${E6_QR_SIGNING_KEY:?Generate an independent synthetic QR key}
      BANK_DETAILS_ENCRYPTION_KEY: ${E6_BANK_DETAILS_ENCRYPTION_KEY:?Generate an independent synthetic bank key}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${E6_POSTGRES_DB:?Set the isolated lab database name}
      POSTGRES_USER: ${E6_POSTGRES_USER:?Set the isolated lab database user}
      POSTGRES_PASSWORD: ${E6_POSTGRES_PASSWORD:?Generate a synthetic lab database password}
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXY_HOST: nginx
      PUBLIC_APP_URL: https://localhost:8443
      SHOP_PAYMENT_PROVIDER: disabled
      EMAIL_HOST: ""
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "false"
      EMAIL_USE_SSL: "false"
      MAILPIT_HOST: ""
      MAILPIT_PORT: "1025"
      CONTACT_RECIPIENT_EMAIL: ""
    volumes:
      - type: bind
        source: ./backend
        target: /app
        read_only: true
      # Empty ignored backend mountpoints are required; named volumes overlay them at runtime.
      - static_data:/app/staticfiles
      - public_media_data:/app/media
      - private_media_data:/app/private_media


    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
  scheduler:
    extends:
      service: backend
    profiles:
      - scheduler-lab
    command: ["python", "manage.py", "run_shop_scheduler_lab", "--limit", "100"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SHOP_PAYMENT_PROVIDER: fake
      SHOP_SCHEDULER_LAB_ENABLED: "true"
      SHOP_SCHEDULER_LAB_DATABASE_NAME: ${E6_POSTGRES_DB:?Set the isolated lab database name}
      SHOP_SCHEDULER_LAB_DATABASE_HOST: db
  nginx:
    image: nginx:1.27.5-alpine
    pull_policy: never
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - type: bind
        source: ./frontend/deploy-nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${E6_TLS_CERT_DIR:?Generate a temporary local TLS certificate directory}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./frontend/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - static_data:/srv/static:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - internal
      - edge
networks:
  internal:
    internal: true
  edge:
volumes:
  # Kept as separate project volumes for the T7/T8 lab; never mounted into Nginx.
  public_media_data:
  private_media_data:
  postgres_data:
  redis_data:
  static_data:
