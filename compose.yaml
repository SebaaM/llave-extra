services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Ejecuta primero scripts/dev.ps1 o scripts/dev.sh}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      POSTGRES_HOST: db
      MAILPIT_HOST: mailpit
      TRUSTED_PROXY_HOST: nginx
      DEMO_CREDENTIALS_PATH: /workspace/docs/cuentas-prueba.local.md
    volumes:
      - ./backend:/app
      - ./docs:/workspace/docs
      - media_data:/app/media
      - private_media_data:/app/private_media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: /api/v1
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    ports:
      - "127.0.0.1:5173:5173"
  nginx:
    image: nginx:1.27.5-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./deploy/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [backend, frontend]
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:8025:8025"
volumes:
  postgres_data:
  media_data:
  private_media_data:
  redis_data:
