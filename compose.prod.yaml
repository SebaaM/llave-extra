name: llaveextra-prod
services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    env_file: .env.prod
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    restart: unless-stopped
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--access-logfile", "-", "--error-logfile", "-"]
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXY_HOST: nginx
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - private_media_data:/app/private_media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - static_data:/srv/static:ro
      - ${TLS_CERT_DIR:?Indique TLS_CERT_DIR en .env.prod}:/etc/nginx/tls:ro
    depends_on: [backend]
volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  private_media_data:
